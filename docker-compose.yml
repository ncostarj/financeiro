services:
  financeiro-nginx:
    image: nginx:alpine
    hostname: financeiro-nginx
    container_name: financeiro-nginx
    restart: always
    volumes:
      - ./src:/var/www/html/financeiro
      - ./config/conf.d:/etc/nginx/conf.d
    depends_on:
      - financeiro-php
    networks:
      - harbor-gateway
  financeiro-php:
    image: harbor/php:8.2-fpm
    hostname: financeiro-php
    container_name: financeiro-php
    restart: always
    volumes:
      - ./src:/var/www/html/financeiro
      - ~/.ssh:/home/harbor/.ssh:ro
    working_dir: /var/www/html/financeiro
    networks:
      harbor-gateway:
        aliases:
          - financeiro.localhost
      harbor-data: 
networks:
  harbor-gateway:
    external: true
  harbor-data:
    external: true