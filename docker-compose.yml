services:
  financeiro-app:
    image: homelab/php:8.2
    container_name: financeiro_app
    working_dir: /var/www/html/financeiro
    volumes:
      - ./src:/var/www/html/financeiro
    restart: unless-stopped
    networks:
      - proxy
      - internal
  financeiro-nginx:
    image: nginx:alpine
    container_name: financeiro_nginx
    working_dir: /var/www/html/financeiro
    volumes:
      - ./src:/var/www/html/financeiro
      - ./docker/config/nginx/conf.d:/etc/nginx/conf.d
    restart: unless-stopped
    depends_on:
      - financeiro_app
    networks:
      - proxy
networks:
  proxy:
    external: true
  internal:
    external: true
