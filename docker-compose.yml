services:
  financeiro-nginx:
    image: nginx:alpine
    hostname: financeiro-nginx
    container_name: financeiro-nginx
    restart: always
    volumes:
      - ./src:/var/www/html/financeiro
      - ./config/conf.d:/etc/nginx/conf.d
    depends_on:
      - financeiro-php
    networks:
      - proxy
  financeiro-php:
    image: homelab/php:8.2-fpm
    hostname: financeiro-php
    container_name: financeiro-php
    restart: always
    build:
      context: ../../infra/php/82
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./src:/var/www/html/financeiro
      - ~/.ssh:/home/proxy/.ssh:ro
    working_dir: /var/www/html/financeiro
    networks:
      - proxy
      - internal 
networks:
  proxy:
    external: true
  internal:
    external: true